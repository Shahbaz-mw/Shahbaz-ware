server {
    listen 8080;
    server_name _;

    client_max_body_size 100M;


    # ==========================================================
    # GATEWAY
    # ==========================================================

    location = / {
        default_type text/plain;
        return 200 "PCTS Backend Gateway OK\n";
    }

    location = /health {
        default_type text/plain;
        return 200 "PCTS Backend Gateway OK\n";
    }


    # ==========================================================
    # IDENTITY ROOT
    # ==========================================================

    location = /identity {
        return 301 /identity/;
    }

    location = /identity/ {
        proxy_pass http://identityservice:8080/health/live;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ==========================================================
    # IDENTITY SWAGGER / PREFIX ROUTES
    #
    # /identity/swagger/index.html
    # -> identityservice:8080/swagger/index.html
    # ==========================================================

    location /identity/ {
        proxy_pass http://identityservice:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /identity;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # ==========================================================
    # MASTER ROOT
    # ==========================================================

    location = /master {
        return 301 /master/;
    }

    location = /master/ {
        proxy_pass http://master:8080/health/live;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ==========================================================
    # MASTER SWAGGER + ALL PREFIXED MASTER APIs
    #
    # /master/swagger/index.html
    # -> master:8080/swagger/index.html
    #
    # /master/api/bankmaster
    # -> master:8080/api/bankmaster
    #
    # /master/api/branchmaster
    # -> master:8080/api/branchmaster
    #
    # /master/api/ANY-NEW-API
    # -> master:8080/api/ANY-NEW-API
    # ==========================================================

    location /master/ {
        proxy_pass http://master:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /master;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # ==========================================================
    # LEGACY MASTER API - BANK MASTER
    #
    # Keeps existing Swagger/frontend URL working:
    #
    # /api/bankmaster
    # /api/bankmaster/...
    # ==========================================================

    location = /api/bankmaster {
        proxy_pass http://master:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/bankmaster/ {
        proxy_pass http://master:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # ==========================================================
    # LEGACY MASTER API - BRANCH MASTER
    #
    # Keeps existing Swagger/frontend URL working:
    #
    # /api/branchmaster
    # /api/branchmaster/...
    # ==========================================================

    location = /api/branchmaster {
        proxy_pass http://master:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/branchmaster/ {
        proxy_pass http://master:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # ==========================================================
    # IDENTITY APIs
    #
    # Existing Identity Swagger uses:
    #
    # /api/auth/login
    # /api/modules
    # etc.
    #
    # bankmaster and branchmaster are matched ABOVE and therefore
    # are sent to Master.
    # ==========================================================

    location /api/ {
        proxy_pass http://identityservice:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # ==========================================================
    # IDENTITY UPLOADED IMAGES
    # ==========================================================

    location /images/ {
        proxy_pass http://identityservice:8080/images/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
