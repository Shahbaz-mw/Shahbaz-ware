services:

  # ==========================================================
  # IDENTITY SERVICE
  # ==========================================================
  identityservice:
    image: pcts2/identityservice:${IMAGE_TAG:-latest}
    container_name: pcts-identityservice
    restart: unless-stopped

    expose:
      - "8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__PctsLogin: "Server=103.48.51.57,${SQLSERVER_PORT:-1433};Database=PctsLogin;User Id=${SQLSERVER_USER};Password=${SQLSERVER_PASSWORD};TrustServerCertificate=True;"

      Jwt__Key: ${JWT_SIGNING_KEY}
      Jwt__Issuer: PCTS2.IdentityService
      Jwt__Audience: PCTS2.Clients
      Jwt__AccessTokenExpirationMinutes: "15"
      Jwt__RefreshTokenExpirationDays: "7"

    volumes:
      - /opt/pcts2/uploads/images:/app/uploads/images

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - pcts-net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  # ==========================================================
  # MASTER MICROSERVICE
