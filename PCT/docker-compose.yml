  backend-gateway:
    image: nginx:alpine
    container_name: pcts-backend-gateway
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - ./nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      identityservice:
        condition: service_healthy
      master:
        condition: service_healthy
      dhs:
        condition: service_healthy
      medical:
        condition: service_healthy
      janaadhaar:
        condition: service_healthy

    networks:
      - pcts-net


# ==========================================================
# NETWORK
# ==========================================================
networks:
  pcts-net:
    name: docker_pcts-net
    driver: bridge
